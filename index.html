<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交接班</title>
<link rel="stylesheet" href="style.css?v=20261103a">
</head>
<body>
  <div id="stage">
    <div id="bg-a" class="bg"></div>
    <div id="bg-b" class="bg"></div>
    <div id="grain"></div>
    <div id="ledger"></div>
    <div id="tickfx"></div>

    <div id="hud">
      <div class="clockwrap"><div id="clockface" title="你的时间"><div class="hand"></div><div class="pin"></div></div><div id="clocklabel"></div></div>
      <div id="day"></div>
    </div>

    <div id="box">
      <div id="who"></div>
      <div id="text"></div>
      <div id="hint">点一下继续</div>
    </div>

    <div id="choices"></div>
    <div id="keyhint">M · 声音　H · 规矩</div>

    <div id="title" class="overlay show">
      <div class="t1">交接班</div>
      <div class="t2">凌晨三点到五点，一道铁门</div>
      <div class="t3">点一下开始</div>
    </div>

    <div id="ending" class="overlay">
      <div id="endtext"></div>
      <div class="t3" id="again">点一下，重来</div>
    </div>

    <div id="help">
      <div class="ht">这间店的规矩</div>
      <div class="hb">一、只存一样东西：别人对你说过的一句话，写成纸条，锁进柜台下面的柜子。
二、一件存七天。七天没人来取，纸条就没了。
三、柜台上那口钟比外面慢。你每替客人拿一次主意，它就慢一格。
四、钟慢到停，就轮到你。
五、你随时可以什么都不做——但钟照样会走。</div>
      <div class="hk">按 H 或点一下，关掉</div>
    </div>
  </div>
  <script src="main.js?v=20261103b"></script>
</body>
</html>
